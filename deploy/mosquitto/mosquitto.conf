# Mosquitto 2 config for the Pollinator Station (issue #24).
# Mounted read-only into the container by deploy/compose.yaml.

# Listen on port 1883 inside the container. compose.yaml binds it to
# 127.0.0.1 on the Pi, only programs on the Pi can connect.
listener 1883

# No username/password. Safe because port is bound to 127.0.0.1:
# nothing outside the Pi can reach the broker.
allow_anonymous true

# Keep retained messages (station status) across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to a file (deploy/data/mosquitto/log/) and to `docker compose logs`.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
